[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# ---------- Security headers (ทุกหน้า) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ---------- Cache ----------
# ไฟล์ของ Next ใส่ hash ในชื่อไฟล์ จึง cache ยาวได้
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# รูปไม่มี hash ในชื่อ — cache 7 วัน
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# ---------- รวมโดเมน ----------
# บังคับทุกเวอร์ชัน (www, http) ไปที่ https://s2000steelfab.com แบบ 301
[[redirects]]
  from = "https://www.s2000steelfab.com/*"
  to = "https://s2000steelfab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.s2000steelfab.com/*"
  to = "https://s2000steelfab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://s2000steelfab.com/*"
  to = "https://s2000steelfab.com/:splat"
  status = 301
  force = true
